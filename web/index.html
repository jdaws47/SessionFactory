<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session Factory</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='4' width='12' height='10' rx='1' fill='%23f28c28'/%3E%3Cpath d='M3 5l10 8M13 5L3 13' stroke='%237a3d0a' stroke-width='1.5'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="topbar"></div>
    <main id="stage">
      <canvas id="floor" aria-label="Factory floor showing Claude sessions as crates"></canvas>
      <aside id="inbox" hidden></aside>
    </main>
    <div id="crate-window" hidden>
      <section class="cw-frame">
        <header id="cw-head"></header>
        <div class="cw-body">
          <div id="cw-term"></div>
          <div id="cw-info" hidden></div>
        </div>
      </section>
    </div>
    <div id="wh-bar" hidden></div>
    <div id="stack-panel" hidden></div>
    <div id="tooltip" hidden></div>
    <div id="warehouse" hidden></div>
    <div id="modal" hidden></div>
    <div id="toast"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
